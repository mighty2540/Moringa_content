<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .product-container {

  display: flex; /* Activate flexbox layout */

  flex-wrap: wrap; /* Allow elements to wrap on smaller screens */

}

.product-container img {

  flex: 0 0 50%; /* Set image width to 50% of container */

  padding: 1em; /* Add some padding around the image */

}

.product-info {

  flex: 1 1 auto; /* Allow remaining space for product info */

  padding: 1em; /* Add padding for content */

}

/* Media Queries for Responsive Adjustments (Example - Tablets) */

@media only screen and (max-width: 768px) {

  .product-container img {

    flex: 1 1 100%; /* Set image to 100% width on smaller screens */

  }

}
    </style>
</head>
<body>
    <div class="product-container">

    <img src="https://placehold.co/600x400" alt="Product Image">

    <div class="product-info">

     <h2>Product Name</h2>

   <p>Description of the product and its benefits.</p>

<ul>

   <li>Feature 1</li>

   <li>Feature 2</li>

   <li>Feature 3</li>

</ul>

  </div>

</div>
    
</body>
</html>
